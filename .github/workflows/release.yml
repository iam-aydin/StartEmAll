name: Release

# Push a tag like v1.0.0 and this builds the installer and attaches it to a GitHub Release.
# (Run manually from the Actions tab to just get the installer as a downloadable artifact.)
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VER=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV; else echo "VER=0.0.0-dev" >> $GITHUB_ENV; fi

      - name: Publish app
        shell: cmd
        run: dotnet publish StartEmAll.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=%VER% -o dist

      - name: Install Inno Setup
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DAppVersion=%VER% installer\StartEmAll.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: StartEmAll-Setup
          path: installer/Output/StartEmAll-Setup.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/StartEmAll-Setup.exe
            dist/StartEmAll.exe
          generate_release_notes: true
